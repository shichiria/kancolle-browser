<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.exercise-alert {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  color: #fff4dc;
  background: rgba(68, 26, 4, 0.95);
  border: 2px solid #ff9f1c;
  border-radius: 8px;
  box-shadow: 0 3px 16px rgba(0, 0, 0, 0.65);
  animation: warning-pulse 1.15s ease-in-out infinite;
}
@keyframes warning-pulse {
  0%, 100% { border-color: #ff9f1c; filter: brightness(1); }
  50% { border-color: #ffe066; filter: brightness(1.25); }
}
.icon {
  font-size: 27px;
  line-height: 1;
}
.title {
  color: #ffd166;
  font-size: 14px;
  font-weight: 800;
}
.detail {
  margin-top: 2px;
  font-size: 12px;
  font-weight: 600;
}
</style>
</head>
<body>
<div id="alert-root"></div>
<script>
window.showExerciseAlert = function(minutesRemaining) {
  document.getElementById("alert-root").innerHTML =
    '<div class="exercise-alert">' +
      '<div class="icon">\u26A0</div>' +
      '<div><div class="title">\u6F14\u7FD2\u304C\u672A\u5B9F\u65BD\u3067\u3059</div>' +
      '<div class="detail">\u6F14\u7FD2\u66F4\u65B0\u307E\u3067\u3042\u3068 ' +
      minutesRemaining + ' \u5206</div></div>' +
    '</div>';
};
</script>
</body>
</html>
