<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.timer {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #e8f5e9;
  background: linear-gradient(180deg, rgba(20, 74, 63, 0.97), rgba(8, 43, 39, 0.97));
  border: 2px solid #63d6b5;
  border-radius: 7px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.68), inset 0 0 9px rgba(99, 214, 181, 0.14);
  text-shadow: 0 1px 2px #000;
}
.timer.ready {
  color: #fff3cd;
  background: linear-gradient(180deg, rgba(99, 58, 5, 0.98), rgba(61, 34, 2, 0.98));
  border-color: #ffd166;
  animation: ready-pulse 1.2s ease-in-out infinite;
}
@keyframes ready-pulse {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.2); }
}
.title {
  font-size: 10px;
  font-weight: 800;
  line-height: 13px;
  white-space: nowrap;
}
.value {
  color: #fff;
  font-size: 16px;
  font-weight: 900;
  line-height: 18px;
  letter-spacing: 0.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ready .value {
  color: #ffd166;
  font-size: 11px;
  letter-spacing: 0;
}
</style>
</head>
<body>
<div id="timer-root"></div>
<script>
(function() {
  var root = document.getElementById("timer-root");
  var timerData = null;
  var intervalId = null;

  function render() {
    if (!timerData) return;
    var remaining = Math.max(0, timerData.deadline_ms - Date.now());
    var seconds = Math.ceil(remaining / 1000);
    var ready = seconds <= 0;
    var value;
    if (ready) {
      value = "\u6BCD\u6E2F\u66F4\u65B0\u5F85\u3061";
    } else {
      var minutes = Math.floor(seconds / 60);
      var rest = seconds % 60;
      value = String(minutes).padStart(2, "0") + ":" + String(rest).padStart(2, "0");
    }
    root.innerHTML =
      '<div class="timer' + (ready ? ' ready' : '') + '">' +
        '<div class="title">' + timerData.ship_name + ' \u7D66\u7CE7 COND+' +
          timerData.recovery + '</div>' +
        '<div class="value">' + value + '</div>' +
      '</div>';
  }

  window.showNozakiTimer = function(data) {
    timerData = data;
    if (intervalId) clearInterval(intervalId);
    render();
    intervalId = setInterval(render, 250);
  };
})();
</script>
</body>
</html>
