<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #e0e0e0;
}
.battle-info-panel {
  background: rgba(10, 25, 47, 0.90);
  border: 1px solid #0f3460;
  border-radius: 6px;
  padding: 6px 14px;
  display: inline-flex;
  gap: 14px;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}
.battle-info-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.battle-info-label {
  font-size: 9px;
  color: #78909c;
  letter-spacing: 0.5px;
}
.battle-info-value {
  font-size: 14px;
  font-weight: bold;
  text-shadow: 0 0 6px currentColor;
  white-space: nowrap;
}
.battle-info-lbas {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  padding-left: 10px;
  border-left: 1px dashed #34557a;
}
.battle-info-lbas-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  line-height: 1.1;
}
.battle-info-lbas-tag {
  font-size: 9px;
  color: #b0bec5;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid #34557a;
  border-radius: 3px;
  padding: 1px 4px;
  white-space: nowrap;
}
.battle-info-lbas-seiku {
  font-weight: bold;
  text-shadow: 0 0 4px currentColor;
  white-space: nowrap;
}
</style>
</head>
<body>
<div id="battle-info-root"></div>
<script>
(function() {
  var root = document.getElementById('battle-info-root');

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  window.showBattleInfo = function(data) {
    var html = '<div class="battle-info-panel">';
    html += '<div class="battle-info-item">';
    html += '<span class="battle-info-label">\u4EA4\u6226</span>';
    html += '<span class="battle-info-value" style="color:' + escapeHtml(data.engagement_color || '#b0bec5') + ';">' + escapeHtml(data.engagement || '') + '</span>';
    html += '</div>';
    if (data.air_control) {
      html += '<div class="battle-info-item">';
      html += '<span class="battle-info-label">\u672C\u6226\u5236\u7A7A</span>';
      html += '<span class="battle-info-value" style="color:' + escapeHtml(data.air_control_color || '#78909c') + ';">' + escapeHtml(data.air_control) + '</span>';
      html += '</div>';
    }
    var waves = Array.isArray(data.lbas_waves) ? data.lbas_waves : [];
    if (waves.length > 0) {
      html += '<div class="battle-info-lbas">';
      for (var i = 0; i < waves.length; i++) {
        var w = waves[i];
        html += '<div class="battle-info-lbas-row">';
        html += '<span class="battle-info-lbas-tag">\u57FA' + escapeHtml(w.base_id) + ' \u6CE2' + escapeHtml(w.wave) + '</span>';
        html += '<span class="battle-info-lbas-seiku" style="color:' + escapeHtml(w.color || '#78909c') + ';">' + escapeHtml(w.text || '-') + '</span>';
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
    root.innerHTML = html;
  };

  window.hideBattleInfo = function() {
    root.innerHTML = '';
  };
})();
</script>
</body>
</html>
