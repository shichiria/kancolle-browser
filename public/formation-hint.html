<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
}
.frame {
  position: absolute;
  box-sizing: border-box;
  border: 2px solid #00e5ff;
  border-radius: 4px;
  box-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
}
</style>
</head>
<body>
<div id="formation-frame" class="frame"></div>
<div id="smoke-frame" class="frame" hidden></div>
<script>
function applyRect(element, rect) {
  element.style.left = (rect[0] * 100) + '%';
  element.style.top = (rect[1] * 100) + '%';
  element.style.width = (rect[2] * 100) + '%';
  element.style.height = (rect[3] * 100) + '%';
}

window.setFormationHint = function(formationRect, smokeRect) {
  applyRect(document.getElementById('formation-frame'), formationRect);
  var smokeFrame = document.getElementById('smoke-frame');
  smokeFrame.hidden = !smokeRect;
  if (smokeRect) {
    applyRect(smokeFrame, smokeRect);
  }
};

window.setFormationHint([0, 0, 1, 1], null);
</script>
</body>
</html>
